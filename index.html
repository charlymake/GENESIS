<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Genesis IA</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --black:#0d0d0e; --card:#161617; --side:#18181a; --side-hover:#26262a; --side-active:#ffffff;
    --ink:#1f1f21; --input:#2b2b2e; --gray:#8a8a8f; --line:#e7e7e9; --white:#ffffff; --off:#f4f4f5;
    --err:#ff8a8a;
    --petrol:#11407B;
    --side-w:248px; --side-w-mini:64px; --top-h:56px;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;font-family:"Nunito Sans",system-ui,sans-serif;background:var(--white);color:var(--ink)}
  [hidden]{display:none !important}
  button{font:inherit}

  /* Logo */
  .brand{display:inline-flex;flex-direction:column;align-items:flex-end;line-height:1;user-select:none}
  .brand .word{font-weight:800;letter-spacing:-.5px}
  .brand .word b{font-weight:800;color:var(--gray)}
  .brand .tag{font-weight:800;letter-spacing:1.5px;margin-top:2px}
  /* Acento de marca: azul petróleo en la "g" y en "IA" */
  .brand .word b, .brand .tag{color:var(--petrol) !important}

  /* ===== Inicio de sesión ===== */
  .login{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:16px;background:var(--white)}
  .login-card{width:100%;max-width:400px;min-height:240px;background:var(--card);border-radius:18px;box-shadow:10px 12px 26px rgba(0,0,0,.35);padding:44px 32px 30px;display:flex;flex-direction:column;align-items:center}
  .login-card .brand{color:var(--white);margin-bottom:28px}
  .login-card .word{font-size:40px}
  .login-card .tag{font-size:12px;color:var(--white)}
  .form{width:100%;max-width:200px;display:flex;flex-direction:column;gap:12px}
  .field{position:relative}
  .field svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);width:13px;height:13px;color:var(--gray)}
  .field input{width:100%;height:26px;border:1px solid #3a3a3e;border-radius:99px;background:var(--input);color:var(--white);font:inherit;font-size:12px;font-weight:600;padding:0 12px 0 29px;outline:none}
  .field input::placeholder{color:#a9a9ae}
  .field input:focus{border-color:var(--white)}
  .btn-in{height:26px;border:0;border-radius:99px;background:var(--white);color:var(--black);font-size:12px;font-weight:800;cursor:pointer;transition:background .15s}
  .btn-in:hover{background:#dcdcdf}
  .btn-in:disabled{opacity:.6;cursor:default}
  .msg{min-height:16px;font-size:11px;text-align:center;color:var(--err)}
  .corner{position:fixed;right:14px;bottom:10px;color:var(--black)}
  .corner .word{font-size:20px}
  .corner .tag{font-size:8px}

  /* ===== Carga ===== */
  .loader{position:fixed;inset:0;z-index:80;display:flex;align-items:center;justify-content:center;background:rgba(8,8,9,.82);opacity:0;transition:opacity .25s}
  .loader.show{opacity:1}
  .ring{position:relative;width:160px;height:160px;display:flex;align-items:center;justify-content:center}
  .ring::before,.ring::after{content:"";position:absolute;border-radius:50%;border:3px solid transparent}
  .ring::before{inset:0;border-top-color:var(--white);border-right-color:var(--white);animation:spin 1s cubic-bezier(.5,.1,.5,.9) infinite}
  .ring::after{inset:14px;border-bottom-color:#9a9aa0;border-left-color:#9a9aa0;animation:spin 1.4s linear infinite reverse}
  .ring .brand{color:var(--white);animation:pulse 1.2s ease-in-out infinite}
  .ring .word{font-size:28px}
  .ring .tag{font-size:9px;color:var(--white)}
  .bar{position:absolute;bottom:-34px;left:50%;transform:translateX(-50%);width:120px;height:2px;background:#333;border-radius:2px;overflow:hidden}
  .bar i{display:block;height:100%;width:0;background:var(--white);animation:fill 2s linear forwards}
  @keyframes spin{to{transform:rotate(360deg)}}
  @keyframes pulse{50%{opacity:.55}}
  @keyframes fill{to{width:100%}}

  /* ===== App ===== */
  .app{height:100%;display:flex;flex-direction:column;background:var(--off)}
  .top{height:var(--top-h);flex:none;display:flex;align-items:center;gap:12px;padding:0 16px;background:var(--black);color:var(--white)}
  .top .brand .word{font-size:22px}
  .top .brand .tag{font-size:8px;color:var(--white)}
  .top .spacer{flex:1}
  .top .where{font-size:13px;color:#b9b9be;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .icon-btn{width:36px;height:36px;display:inline-flex;align-items:center;justify-content:center;border:0;border-radius:8px;background:transparent;color:var(--white);cursor:pointer}
  .icon-btn:hover{background:#222}
  .icon-btn svg{width:20px;height:20px}
  .menu-toggle{display:none}

  .body{flex:1;display:flex;min-height:0}

  /* ===== Menú lateral ===== */
  .side{width:var(--side-w);flex:none;background:var(--side);color:var(--white);display:flex;flex-direction:column;transition:width .2s ease;overflow:hidden}
  .side-head{display:flex;align-items:center;gap:8px;padding:12px 12px 8px}
  .collapse-btn svg{transition:transform .2s}
  .search{flex:1;position:relative}
  .search input{width:100%;height:32px;border:0;border-radius:99px;background:var(--white);color:var(--black);font:inherit;font-size:13px;font-style:italic;padding:0 34px 0 14px;outline:none}
  .search input:focus{box-shadow:0 0 0 2px #8a8a8f}
  .search svg{position:absolute;right:11px;top:50%;transform:translateY(-50%);width:15px;height:15px;color:var(--black);pointer-events:none}

  .nav{flex:1;overflow-y:auto;padding:4px 8px 8px;scrollbar-width:thin;scrollbar-color:#333 transparent}
  .nav-item{width:100%;display:flex;align-items:center;gap:12px;min-height:40px;padding:8px 10px;border:0;border-radius:8px;background:transparent;color:#e9e9ec;font-size:13px;font-weight:700;text-align:left;cursor:pointer;white-space:nowrap}
  .nav-item:hover{background:var(--side-hover)}
  .nav-item.active{background:var(--side-active);color:var(--black)}
  .nav-item .ico{width:22px;height:22px;flex:none;display:flex;align-items:center;justify-content:center}
  .nav-item .ico svg{width:20px;height:20px}
  .nav-item .lbl{flex:1;overflow:hidden;text-overflow:ellipsis}
  .nav-item .chev{width:14px;height:14px;flex:none;transition:transform .2s;opacity:.8}
  .group.open > .nav-item .chev{transform:rotate(180deg)}
  .sub{display:none;padding:2px 0 4px 34px}
  .group.open > .sub{display:block}
  .sub .nav-item{min-height:32px;font-weight:600;font-size:12.5px;color:#c9c9ce;padding:6px 10px}
  .sub .nav-item::before{content:"";width:5px;height:5px;border-radius:50%;background:#6b6b70;flex:none}
  .sub .nav-item.active{color:var(--black);font-weight:800}
  .sub .nav-item.active::before{background:var(--black)}
  .nav-sep{height:1px;background:#2c2c30;margin:8px 6px}
  .no-results{font-size:12px;color:var(--gray);padding:10px 12px}
  .side-foot{padding:8px;border-top:1px solid #2c2c30}

  /* Menú contraído (solo iconos) */
  .side.mini{width:var(--side-w-mini)}
  .side.mini .search,.side.mini .lbl,.side.mini .chev,.side.mini .sub,.side.mini .no-results{display:none !important}
  .side.mini .side-head{justify-content:center}
  .side.mini .collapse-btn svg{transform:rotate(180deg)}
  .side.mini .nav-item{justify-content:center;padding:8px 0}

  /* Contenido */
  .main{flex:1;min-width:0;overflow:auto;padding:24px}
  .page-title{margin:0 0 6px;font-size:22px;font-weight:800;color:var(--black)}
  .page-sub{margin:0 0 18px;color:var(--gray);font-size:14px}
  .placeholder{background:var(--white);border:1px dashed #d4d4d8;border-radius:12px;padding:40px 16px;text-align:center;color:var(--gray)}

  /* Paneles */
  .panel{background:var(--white);border:1px solid var(--line);border-radius:12px;padding:18px}
  .panel-title{font-size:13px;font-weight:800;letter-spacing:1px;color:var(--black);margin-bottom:14px}
  .panel-foot{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:16px;flex-wrap:wrap}
  .muted{color:var(--gray);font-size:13px}
  .btn-dark{padding:9px 22px;border:0;border-radius:99px;background:var(--black);color:var(--white);font-weight:800;font-size:13px;cursor:pointer}
  .btn-dark:hover{background:#2a2a2d}
  .btn-dark:disabled{opacity:.35;cursor:default}
  .link{background:none;border:0;padding:0;color:var(--black);font-weight:700;font-size:13px;text-decoration:underline;cursor:pointer}
  .link.danger{color:#c03535}
  .spin-sm{width:14px;height:14px;border:2px solid #ddd;border-top-color:var(--black);border-radius:50%;display:inline-block;vertical-align:-2px;margin-right:8px;animation:spin 1s linear infinite}

  /* Selector de tienda */
  .store-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
  .store{position:relative;display:flex;align-items:center;gap:12px;padding:12px 14px;border:1px solid #d9d9dd;border-radius:6px;background:var(--white);cursor:pointer;transition:border-color .15s, box-shadow .15s}
  .store:hover{border-color:#9a9aa0}
  .store input{position:absolute;opacity:0;pointer-events:none}
  .store .dot{width:18px;height:18px;flex:none;border:1.5px solid #8a8a8f;border-radius:50%;display:flex;align-items:center;justify-content:center}
  .store .dot::after{content:"";width:9px;height:9px;border-radius:50%;background:var(--black);transform:scale(0);transition:transform .15s}
  .store:has(input:checked){border-color:var(--black);box-shadow:0 0 0 1px var(--black)}
  .store:has(input:checked) .dot{border-color:var(--black)}
  .store:has(input:checked) .dot::after{transform:scale(1)}
  .store:has(input:focus-visible){outline:2px solid var(--petrol);outline-offset:2px}
  .st-txt{display:flex;flex-direction:column;min-width:0}
  .st-name{font-size:14px;font-weight:700;color:var(--black)}
  .st-sub{font-size:12px;color:var(--gray);margin-top:2px}

  /* Configuración de tiendas */
  .add-row{display:flex;gap:8px;flex-wrap:wrap}
  .add-row input{flex:1;min-width:180px;padding:9px 12px;border:1px solid #d9d9dd;border-radius:8px;font:inherit;font-size:14px}
  .add-row input:focus{outline:none;border-color:var(--black)}
  .form-msg{min-height:18px;font-size:13px;color:#c03535;margin:6px 0}
  .t-form{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:6px}
  .t-form label{display:flex;flex-direction:column;gap:5px;font-size:12px;font-weight:700;color:#55555a}
  .t-form .span2{grid-column:1 / -1}
  .t-form input{padding:9px 12px;border:1px solid #d9d9dd;border-radius:8px;font:inherit;font-size:14px;font-weight:400;color:var(--black);width:100%}
  .t-form input:focus{outline:none;border-color:var(--black)}
  .loc{display:flex;align-items:center;gap:8px;position:relative}
  .loc svg{position:absolute;left:11px;width:16px;height:16px;color:var(--gray);pointer-events:none}
  .loc input{padding-left:34px;flex:1}
  .btn-light{padding:9px 16px;border:1px solid #d9d9dd;border-radius:99px;background:var(--white);color:var(--black);font-weight:700;font-size:13px;cursor:pointer;white-space:nowrap}
  .btn-light:hover{border-color:var(--black)}
  .map-box{border:1px solid var(--line);border-radius:10px;overflow:hidden;height:220px;background:#eee}
  .map-box iframe{width:100%;height:100%;border:0;filter:grayscale(.35)}
  .t-actions{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .t-actions .form-msg{margin:0}
  .row-actions{display:flex;gap:14px;flex:none}
  .maplink{color:var(--petrol);font-weight:700}
  @media (max-width:640px){ .t-form{grid-template-columns:1fr} .loc{flex-wrap:wrap} .loc .btn-light{width:100%} }
  .t-list{list-style:none;margin:0;padding:0}
  .t-list li{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 4px;border-bottom:1px solid var(--line)}
  .t-list li:last-child{border-bottom:0}

  /* Celular: el menú se abre como cajón */
  .scrim{display:none}
  @media (max-width:760px){
    .menu-toggle{display:inline-flex}
    .top .where{display:none}
    .side{position:fixed;top:var(--top-h);bottom:0;left:0;z-index:40;width:min(86vw,var(--side-w)) !important;transform:translateX(-100%);transition:transform .22s ease;box-shadow:8px 0 24px rgba(0,0,0,.3)}
    .side.open{transform:none}
    .side .collapse-btn{display:none}
    .side.mini .search,.side.mini .lbl,.side.mini .chev,.side.mini .no-results{display:revert !important}
    .side.mini .nav-item{justify-content:flex-start;padding:8px 10px}
    .scrim{display:block;position:fixed;inset:var(--top-h) 0 0 0;background:rgba(0,0,0,.4);z-index:30;opacity:0;pointer-events:none;transition:opacity .2s}
    .scrim.show{opacity:1;pointer-events:auto}
    .main{padding:16px}
  }
</style>
</head>
<body>

<!-- Inicio de sesión -->
<div class="login" id="login">
  <div class="login-card">
    <div class="brand"><div class="word"><b>g</b>enesis</div><div class="tag">IA</div></div>
    <form class="form" id="loginForm" autocomplete="off">
      <div class="field">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M17 9V7a5 5 0 0 0-10 0v2H5v13h14V9h-2zm-8 0V7a3 3 0 0 1 6 0v2H9z"/></svg>
        <input id="password" type="password" placeholder="Contraseña" required>
      </div>
      <button class="btn-in" id="loginBtn" type="submit">Entrar</button>
      <div class="msg" id="loginMsg"></div>
    </form>
  </div>
  <div class="corner brand"><div class="word"><b>g</b>enesis</div><div class="tag">IA</div></div>
</div>

<!-- Carga -->
<div class="loader" id="loader" hidden>
  <div class="ring">
    <div class="brand"><div class="word"><b>g</b>enesis</div><div class="tag">IA</div></div>
    <div class="bar"><i id="barFill"></i></div>
  </div>
</div>

<!-- App -->
<div class="app" id="app" hidden>
  <header class="top">
    <button class="icon-btn menu-toggle" id="menuToggle" aria-label="Abrir menú">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
    </button>
    <div class="brand"><div class="word"><b>g</b>enesis</div><div class="tag">IA</div></div>
    <div class="spacer"></div>
    <div class="where" id="where"></div>
  </header>

  <div class="body">
    <aside class="side" id="side">
      <div class="side-head">
        <button class="icon-btn collapse-btn" id="collapseBtn" aria-label="Contraer menú" title="Contraer / expandir menú">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
        </button>
        <div class="search">
          <input id="navSearch" type="search" placeholder="Encontrar" aria-label="Buscar en el menú">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
        </div>
      </div>
      <nav class="nav" id="nav"></nav>
      <div class="side-foot" id="sideFoot"></div>
    </aside>
    <div class="scrim" id="scrim"></div>

    <main class="main">
      <h1 class="page-title" id="pageTitle">Inicio</h1>
      <p class="page-sub" id="pageSub">Bienvenido a Genesis</p>
      <div class="placeholder" id="pageBody">Esta sección está lista para construirse.</div>
    </main>
  </div>
</div>

<script>
  const FN_URL = "https://gbiectjjqhbfolnjljoe.supabase.co/functions/v1/analizar-solicitud";
  const $ = id => document.getElementById(id);
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  let CODE = null;

  const store = (area) => ({
    get(k){ try { return window[area].getItem(k); } catch { return null; } },
    set(k,v){ try { window[area].setItem(k, v); } catch {} },
    del(k){ try { window[area].removeItem(k); } catch {} }
  });
  const ss = store('sessionStorage'), ls = store('localStorage');

  async function api(accion, extra = {}){
    const r = await fetch(FN_URL, {
      method: 'POST',
      headers: { 'x-access-code': CODE, 'content-type': 'application/json' },
      body: JSON.stringify({ accion, ...extra })
    });
    const data = await r.json().catch(() => ({ error: `Error ${r.status}` }));
    if (!r.ok || data.error) { const e = new Error(data.error || `Error ${r.status}`); e.status = r.status; throw e; }
    return data;
  }

  // ===== Iconos (línea, blanco y negro) =====
  const I = {
    home:'<path d="M3 11l9-7 9 7"/><path d="M5 10v10h14V10"/><path d="M10 20v-6h4v6"/>',
    doc:'<path d="M14 3H6v18h12V7z"/><path d="M14 3v4h4"/><path d="M9 12h6M9 16h6"/>',
    users:'<circle cx="9" cy="8" r="3.2"/><path d="M3 20c0-3.3 2.7-6 6-6s6 2.7 6 6"/><circle cx="17" cy="9" r="2.4"/><path d="M16 14c2.8 0 5 2.2 5 5"/>',
    book:'<path d="M4 4h11a3 3 0 0 1 3 3v13H7a3 3 0 0 1-3-3z"/><path d="M4 17a3 3 0 0 1 3-3h11"/>',
    cake:'<path d="M4 20h16v-7H4z"/><path d="M4 15c2 1.5 4 1.5 6 0s4-1.5 6 0 4 1.5 4 0"/><path d="M12 13V9"/><path d="M12 6.5c.8-.8.8-1.7 0-2.5-.8.8-.8 1.7 0 2.5z"/>',
    chart:'<path d="M4 20V4"/><path d="M4 20h16"/><path d="M8 16v-4M12 16V8M16 16v-6"/>',
    ai:'<rect x="5" y="7" width="14" height="12" rx="3"/><path d="M12 3v4"/><circle cx="9.5" cy="13" r="1.2"/><circle cx="14.5" cy="13" r="1.2"/><path d="M2 12v3M22 12v3"/>',
    gear:'<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.6 1.6 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.6 1.6 0 0 0-1.8-.3 1.6 1.6 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.6 1.6 0 0 0-1-1.5 1.6 1.6 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.6 1.6 0 0 0 .3-1.8 1.6 1.6 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.6 1.6 0 0 0 1.5-1 1.6 1.6 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.6 1.6 0 0 0 1.8.3H9a1.6 1.6 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.6 1.6 0 0 0 1 1.5 1.6 1.6 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.6 1.6 0 0 0-.3 1.8V9a1.6 1.6 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.6 1.6 0 0 0-1.5 1z"/>',
    help:'<circle cx="12" cy="12" r="9"/><path d="M9.5 9.5a2.5 2.5 0 1 1 3.5 2.3c-.6.3-1 .9-1 1.6V14"/><circle cx="12" cy="17.2" r=".6" fill="currentColor"/>',
    out:'<path d="M15 4h4v16h-4"/><path d="M10 8l-4 4 4 4"/><path d="M6 12h10"/>',
  };
  const svg = n => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${I[n]}</svg>`;
  const CHEV = '<svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>';

  // ===== Estructura del menú (edítala aquí) =====
  const MENU = [
    { id:'inicio', label:'Inicio', icon:'home' },
    { id:'solicitudes', label:'Solicitudes', icon:'doc', children:[
      { id:'sol-subir', label:'Subir solicitud' },
      { id:'sol-pendientes', label:'Por revisar' },
    ]},
    { id:'personal', label:'Personal', icon:'users', children:[
      { id:'per-lista', label:'Lista de personal' },
      { id:'per-comparar', label:'Comparar' },
    ]},
    { id:'catalogos', label:'Catálogos', icon:'book', children:[
      { id:'cat-empleados', label:'Empleados' },
      { id:'cat-puestos', label:'Puestos' },
      { id:'cat-departamentos', label:'Departamentos' },
    ]},
    { id:'cumpleanos', label:'Cumpleaños', icon:'cake' },
    { id:'reportes', label:'Reportes', icon:'chart' },
    { id:'asistente', label:'Asistente IA', icon:'ai' },
    { sep:true },
    { id:'config', label:'Configuración', icon:'gear' },
    { id:'ayuda', label:'Ayuda', icon:'help' },
  ];
  const FOOT = { id:'salir', label:'Salir', icon:'out' };

  const findItem = id => { for (const m of MENU) { if (m.id === id) return { item:m }; for (const c of (m.children||[])) if (c.id === id) return { item:c, parent:m }; } return null; };

  function renderMenu(filter = ''){
    const f = filter.trim().toLowerCase();
    const match = s => !f || s.toLowerCase().includes(f);
    let html = '', count = 0;
    for (const m of MENU) {
      if (m.sep) { if (!f) html += '<div class="nav-sep"></div>'; continue; }
      const kids = (m.children || []).filter(c => match(c.label) || match(m.label));
      if (!match(m.label) && !kids.length) continue;
      count++;
      if (m.children) {
        const open = f ? true : openGroups.has(m.id);
        html += `<div class="group${open ? ' open' : ''}" data-group="${m.id}">
          <button class="nav-item" data-toggle="${m.id}" title="${esc(m.label)}" aria-expanded="${open}"><span class="ico">${svg(m.icon)}</span><span class="lbl">${esc(m.label)}</span>${CHEV}</button>
          <div class="sub">${kids.map(c => `<button class="nav-item${c.id === current ? ' active' : ''}" data-go="${c.id}" title="${esc(c.label)}"><span class="lbl">${esc(c.label)}</span></button>`).join('')}</div>
        </div>`;
      } else {
        html += `<button class="nav-item${m.id === current ? ' active' : ''}" data-go="${m.id}" title="${esc(m.label)}"><span class="ico">${svg(m.icon)}</span><span class="lbl">${esc(m.label)}</span></button>`;
      }
    }
    if (!count) html = '<div class="no-results">Sin resultados</div>';
    $('nav').innerHTML = html;
  }

  let current = 'inicio';
  const openGroups = new Set();

  function go(id){
    const found = findItem(id); if (!found) return;
    current = id;
    if (found.parent) openGroups.add(found.parent.id);
    renderMenu($('navSearch').value);
    const ruta = found.parent ? `${found.parent.label} › ${found.item.label}` : found.item.label;
    $('pageTitle').textContent = found.item.label;
    $('pageSub').textContent = id === 'inicio' ? 'Bienvenido a Genesis' : ruta;
    $('where').textContent = ruta;
    const vista = VISTAS[id];
    const body = $('pageBody');
    if (vista) { body.className = ''; vista(body); }
    else { body.className = 'placeholder'; body.textContent = 'Esta sección está lista para construirse.'; }
    closeDrawer();
  }

  // ===== Tiendas =====
  let TIENDAS = null;
  async function getTiendas(force){
    if (!TIENDAS || force) { const { tiendas = [] } = await api('tiendas_listar'); TIENDAS = tiendas; }
    return TIENDAS;
  }
  const loading = el => el.innerHTML = '<div class="placeholder"><span class="spin-sm"></span>Cargando…</div>';
  const fail = (el, e) => { if (e.status === 401) return showLogin('Sesión expirada, vuelve a entrar'); el.innerHTML = `<div class="placeholder" style="color:#c03535">${esc(e.message)}</div>`; };

  const VISTAS = {
    // Reportes: primero elegir tienda
    async reportes(el){
      loading(el);
      try {
        const tiendas = await getTiendas(true);
        const sel = ls.get('genesis_tienda');
        if (!tiendas.length) {
          el.innerHTML = `<div class="panel"><div class="panel-title">SELECCIONA LA TIENDA</div>
            <div class="placeholder">Aún no hay tiendas. Agrégalas en <button class="link" id="goConfig">Configuración</button>.</div></div>`;
          $('goConfig').onclick = () => go('config');
          return;
        }
        el.innerHTML = `<div class="panel">
          <div class="panel-title">SELECCIONA LA TIENDA</div>
          <div class="store-grid" role="radiogroup" aria-label="Tienda">
            ${tiendas.map(t => `<label class="store">
              <input type="radio" name="tienda" value="${t.id}" ${t.id === sel ? 'checked' : ''}>
              <span class="dot"></span>
              <span class="st-txt"><span class="st-name">${esc(t.nombre)}</span>${t.ubicacion ? `<span class="st-sub">${esc(t.ubicacion)}</span>` : ''}${t.responsable ? `<span class="st-sub">Resp.: ${esc(t.responsable)}</span>` : ''}</span>
            </label>`).join('')}
          </div>
          <div class="panel-foot"><span id="tiendaSel" class="muted"></span><button class="btn-dark" id="verReporte" disabled>Continuar</button></div>
        </div>
        <div id="reporteArea"></div>`;
        const pintar = () => {
          const id = el.querySelector('input[name=tienda]:checked')?.value;
          const t = tiendas.find(x => x.id === id);
          $('tiendaSel').textContent = t ? `Tienda: ${t.nombre}` : 'Ninguna tienda seleccionada';
          $('verReporte').disabled = !t;
        };
        el.querySelectorAll('input[name=tienda]').forEach(r => r.onchange = () => { ls.set('genesis_tienda', r.value); pintar(); });
        $('verReporte').onclick = () => {
          const t = tiendas.find(x => x.id === ls.get('genesis_tienda'));
          $('reporteArea').innerHTML = `<div class="placeholder" style="margin-top:16px">Reportes de <strong>${esc(t.nombre)}</strong>: listos para construirse.</div>`;
          $('where').textContent = `Reportes › ${t.nombre}`;
        };
        pintar();
      } catch (e) { fail(el, e); }
    },

    // Configuración: agregar / editar / quitar tiendas
    async config(el){
      const mapsUrl = q => 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(q);
      const embedUrl = q => 'https://maps.google.com/maps?q=' + encodeURIComponent(q) + '&z=16&output=embed';
      el.innerHTML = `<div class="panel">
        <div class="panel-title" id="tTitle">TIENDAS</div>
        <form class="t-form" id="tiendaForm" autocomplete="off">
          <input type="hidden" id="tId">
          <label>Nombre de la tienda *<input id="tNombre" maxlength="100" required></label>
          <label>Responsable de tienda<input id="tResp" maxlength="120" placeholder="Nombre del responsable"></label>
          <label class="span2">Ubicación
            <div class="loc">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s-7-6.2-7-11.5A7 7 0 0 1 19 9.5C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></svg>
              <input id="tUbic" maxlength="200" placeholder="Escribe la dirección, ej. Arteaga 2, Centro, Coatepec, Ver.">
              <button type="button" class="btn-light" id="tMaps" title="Buscar en Google Maps">Buscar en Google Maps</button>
            </div>
          </label>
          <div class="map-box span2" id="mapBox" hidden><iframe id="mapFrame" title="Vista previa del mapa" loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe></div>
          <div class="t-actions span2">
            <button class="btn-dark" id="tAdd" type="submit">Agregar</button>
            <button class="btn-light" id="tCancel" type="button" hidden>Cancelar</button>
            <span class="form-msg" id="tMsg"></span>
          </div>
        </form>
        <div id="tLista"></div>
      </div>`;

      // Vista previa del mapa mientras escribes la dirección
      let timer;
      const preview = () => {
        const q = $('tUbic').value.trim();
        clearTimeout(timer);
        if (q.length < 5) { $('mapBox').hidden = true; return; }
        timer = setTimeout(() => { $('mapFrame').src = embedUrl(q); $('mapBox').hidden = false; }, 700);
      };
      $('tUbic').addEventListener('input', preview);
      $('tMaps').onclick = () => {
        const q = $('tUbic').value.trim() || $('tNombre').value.trim();
        window.open(q ? mapsUrl(q) : 'https://www.google.com/maps', '_blank', 'noopener');
      };

      const limpiar = () => {
        $('tiendaForm').reset(); $('tId').value = ''; $('mapBox').hidden = true; $('mapFrame').removeAttribute('src');
        $('tAdd').textContent = 'Agregar'; $('tCancel').hidden = true; $('tTitle').textContent = 'TIENDAS';
      };
      $('tCancel').onclick = limpiar;

      const pintar = async (force) => {
        loading($('tLista'));
        try {
          const tiendas = await getTiendas(force);
          $('tLista').innerHTML = tiendas.length ? `<ul class="t-list">${tiendas.map(t => `
            <li><div>
              <div class="st-name">${esc(t.nombre)}</div>
              ${t.responsable ? `<div class="st-sub">Responsable: ${esc(t.responsable)}</div>` : ''}
              ${t.ubicacion ? `<div class="st-sub">${esc(t.ubicacion)} · <a class="maplink" href="${mapsUrl(t.ubicacion)}" target="_blank" rel="noopener">Ver en mapa</a></div>` : ''}
            </div>
            <div class="row-actions"><button class="link" data-ed="${t.id}">Editar</button><button class="link danger" data-del="${t.id}">Quitar</button></div></li>`).join('')}</ul>`
            : '<div class="placeholder">Aún no hay tiendas.</div>';
          $('tLista').querySelectorAll('[data-ed]').forEach(b => b.onclick = () => {
            const t = tiendas.find(x => x.id === b.dataset.ed);
            $('tId').value = t.id; $('tNombre').value = t.nombre || ''; $('tResp').value = t.responsable || ''; $('tUbic').value = t.ubicacion || '';
            $('tAdd').textContent = 'Guardar cambios'; $('tCancel').hidden = false; $('tTitle').textContent = 'EDITAR TIENDA';
            preview(); $('tNombre').focus(); el.scrollIntoView({ behavior:'smooth' });
          });
          $('tLista').querySelectorAll('[data-del]').forEach(b => b.onclick = async () => {
            const t = tiendas.find(x => x.id === b.dataset.del);
            if (!confirm(`¿Quitar la tienda "${t.nombre}"?`)) return;
            try { await api('tiendas_eliminar', { id: t.id }); if (ls.get('genesis_tienda') === t.id) ls.del('genesis_tienda'); limpiar(); pintar(true); }
            catch (e) { alert(e.message); }
          });
        } catch (e) { fail($('tLista'), e); }
      };
      $('tiendaForm').onsubmit = async ev => {
        ev.preventDefault();
        $('tAdd').disabled = true; $('tMsg').textContent = '';
        try {
          await api('tiendas_guardar', { tienda: { id: $('tId').value || undefined, nombre: $('tNombre').value, responsable: $('tResp').value, ubicacion: $('tUbic').value } });
          limpiar(); $('tNombre').focus(); pintar(true);
        } catch (e) { $('tMsg').textContent = e.message; }
        finally { $('tAdd').disabled = false; }
      };
      pintar(true);
    },
  };

  $('nav').addEventListener('click', e => {
    const t = e.target.closest('[data-toggle]');
    if (t) {
      const side = $('side');
      if (side.classList.contains('mini') && !isMobile()) { setMini(false); openGroups.add(t.dataset.toggle); renderMenu($('navSearch').value); return; }
      const id = t.dataset.toggle;
      openGroups.has(id) ? openGroups.delete(id) : openGroups.add(id);
      renderMenu($('navSearch').value);
      return;
    }
    const g = e.target.closest('[data-go]');
    if (g) go(g.dataset.go);
  });

  $('navSearch').addEventListener('input', e => renderMenu(e.target.value));
  $('navSearch').addEventListener('keydown', e => {
    if (e.key === 'Enter') { const first = $('nav').querySelector('[data-go]'); if (first) { go(first.dataset.go); e.target.value=''; renderMenu(); } }
    if (e.key === 'Escape') { e.target.value=''; renderMenu(); }
  });

  // Contraer / expandir (escritorio) y cajón (celular)
  const isMobile = () => matchMedia('(max-width:760px)').matches;
  function setMini(v){ $('side').classList.toggle('mini', v); ls.set('genesis_menu_mini', v ? '1' : '0'); }
  $('collapseBtn').onclick = () => setMini(!$('side').classList.contains('mini'));
  function openDrawer(){ $('side').classList.add('open'); $('scrim').classList.add('show'); }
  function closeDrawer(){ $('side').classList.remove('open'); $('scrim').classList.remove('show'); }
  $('menuToggle').onclick = () => $('side').classList.contains('open') ? closeDrawer() : openDrawer();
  $('scrim').onclick = closeDrawer;
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') closeDrawer();
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k' && !$('app').hidden) { e.preventDefault(); if (isMobile()) openDrawer(); else setMini(false); $('navSearch').focus(); }
  });

  $('sideFoot').innerHTML = `<button class="nav-item" id="logoutBtn" title="${FOOT.label}"><span class="ico">${svg(FOOT.icon)}</span><span class="lbl">${FOOT.label}</span></button>`;

  // ===== Sesión =====
  function showApp(){
    $('login').hidden = true; $('app').hidden = false;
    setMini(ls.get('genesis_menu_mini') === '1');
    go('inicio');
  }
  function showLogin(msg = ''){ $('app').hidden = true; $('login').hidden = false; $('loginMsg').textContent = msg; $('password').value = ''; $('password').focus(); }

  function startLoader(){
    const l = $('loader'), bar = $('barFill');
    bar.style.animation = 'none'; void bar.offsetWidth; bar.style.animation = '';
    l.hidden = false; requestAnimationFrame(() => l.classList.add('show'));
  }
  function stopLoader(){ const l = $('loader'); l.classList.remove('show'); setTimeout(() => l.hidden = true, 250); }

  $('loginForm').addEventListener('submit', async e => {
    e.preventDefault();
    const pwd = $('password').value.trim();
    if (!pwd) return;
    CODE = pwd;
    $('loginBtn').disabled = true; $('loginMsg').textContent = '';
    startLoader();
    const espera = new Promise(r => setTimeout(r, 2000)); // carga de ~2 s
    try {
      await Promise.all([api('verificar'), espera]);
      ss.set('genesis_code', pwd); showApp();
    } catch (err) {
      await espera;
      CODE = null;
      $('loginMsg').textContent = err.status === 401 ? 'Contraseña incorrecta' : 'No se pudo conectar';
    } finally {
      stopLoader(); $('loginBtn').disabled = false;
    }
  });

  $('logoutBtn').onclick = () => { CODE = null; ss.del('genesis_code'); closeDrawer(); showLogin(); };

  (async () => {
    const saved = ss.get('genesis_code');
    if (saved) { CODE = saved; try { await api('verificar'); showApp(); return; } catch { ss.del('genesis_code'); CODE = null; } }
    showLogin();
  })();
</script>
</body>
</html>
