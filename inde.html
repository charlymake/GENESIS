<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Genesis</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@300;400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --backdrop: rgba(30,34,40,.55);
    --panel:#fff; --header-bg:#fafbfc; --line:#e6e9ee;
    --title:#7d8aa3; --clip:#8fc3f0;
    --primary:#0a9cf5; --primary-hover:#0589db;
    --cyan:#29c1f3; --cyan-hover:#12b0e6;
    --login-card:#555658; --login-input:#8a8b8d;
    --text:#3c4350; --muted:#6b7485; --bg:#eef1f5;
    --ok:#1f9d55; --warn:#c77700; --err:#d64545;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;font-family:"Nunito Sans",system-ui,sans-serif;background:var(--bg);color:var(--text)}
  [hidden]{display:none !important}

  /* ===== Pantalla de inicio ===== */
  .login-screen{position:fixed;inset:0;background:#fff;display:flex;align-items:center;justify-content:center;padding:16px;z-index:50}
  .login-card{width:100%;max-width:400px;min-height:240px;background:var(--login-card);border-radius:18px;box-shadow:8px 10px 22px rgba(0,0,0,.35);padding:44px 32px 20px;display:flex;flex-direction:column;align-items:center}
  .brand{display:flex;flex-direction:column;align-items:flex-end;line-height:1;margin-bottom:28px;color:#fff;user-select:none}
  .brand .word{font-size:40px;font-weight:700;letter-spacing:-.5px}
  .brand .word b{color:var(--cyan);font-weight:800}
  .brand .tag{font-size:12px;font-weight:700;color:var(--cyan);letter-spacing:1px;margin-top:2px}
  .login-form{width:100%;max-width:200px;display:flex;flex-direction:column;gap:12px}
  .pill-input{position:relative}
  .pill-input svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);width:13px;height:13px;color:#e9e9e9}
  .pill-input input{width:100%;height:24px;border:0;border-radius:99px;background:var(--login-input);color:#fff;font:inherit;font-size:12px;font-weight:600;padding:0 12px 0 29px;outline:none}
  .pill-input input::placeholder{color:#f1f1f1}
  .pill-input input:focus{box-shadow:0 0 0 2px rgba(41,193,243,.55)}
  .pill-btn{height:24px;border:0;border-radius:99px;background:var(--cyan);color:#fff;font:inherit;font-size:12px;font-weight:700;cursor:pointer}
  .pill-btn:hover{background:var(--cyan-hover)}
  .pill-btn:disabled{opacity:.6;cursor:default}
  .login-msg{min-height:16px;font-size:11px;text-align:center;color:#ffd0d0}
  .login-foot{margin-top:auto;padding-top:26px;font-size:10px;font-weight:700;color:#f3f3f3;display:flex;align-items:center;gap:5px}
  .corner-mark{position:fixed;right:12px;bottom:10px;font-size:20px;font-weight:700;color:#8b9aa8;display:flex;flex-direction:column;align-items:flex-end;line-height:1}
  .corner-mark b{color:var(--cyan)}
  .corner-mark span{font-size:8px;color:var(--cyan);letter-spacing:.5px}

  /* ===== Carga al entrar ===== */
  .loader{position:fixed;inset:0;z-index:60;display:flex;align-items:center;justify-content:center;background:rgba(20,20,22,.72);opacity:0;transition:opacity .25s}
  .loader.show{opacity:1}
  .loader-ring{position:relative;width:150px;height:150px;display:flex;align-items:center;justify-content:center}
  .loader-ring::before,.loader-ring::after{content:"";position:absolute;inset:0;border-radius:50%;border:3px solid transparent}
  .loader-ring::before{border-top-color:var(--cyan);border-right-color:var(--cyan);animation:spin 1s cubic-bezier(.5,.1,.5,.9) infinite}
  .loader-ring::after{inset:12px;border-bottom-color:var(--cyan);border-left-color:var(--cyan);opacity:.75;animation:spin 1.4s linear infinite reverse}
  .loader-ring .brand{margin:0;animation:pulse 1.2s ease-in-out infinite}
  .loader-ring .word{font-size:26px}
  .loader-ring .tag{font-size:8px}
  @keyframes spin{to{transform:rotate(360deg)}}
  @keyframes pulse{50%{opacity:.6}}

  /* ===== Bienvenida / cumpleaños ===== */
  .welcome{width:100%;max-width:470px;background:#fff;border-radius:10px;box-shadow:0 20px 50px rgba(0,0,0,.3);position:relative;padding:14px 14px 12px;animation:pop .25s ease-out}
  @keyframes pop{from{transform:scale(.94);opacity:0}}
  .welcome .x{position:absolute;top:-10px;right:-10px;width:24px;height:24px;border-radius:50%;border:2px solid #fff;background:#e5484d;color:#fff;font-size:14px;line-height:18px;cursor:pointer;box-shadow:0 2px 6px rgba(0,0,0,.25)}
  .w-head{display:flex;align-items:center;gap:10px;background:#f4f5f7;border-radius:6px;padding:10px 12px;font-size:15px;font-weight:600;color:#3c4350}
  .w-head .ico{font-size:20px}
  .w-sec{margin-top:10px}
  .w-sec-title{display:flex;align-items:center;gap:8px;background:#f4f5f7;border-radius:6px;padding:6px 10px;font-size:12px;font-weight:700;font-style:italic;color:#4b5363}
  .w-date{font-size:13px;color:var(--muted);padding:8px 10px 0}
  .bday-hoy{margin:8px 0 0;padding:12px;border-radius:8px;background:linear-gradient(135deg,#e8f8fe,#fff4fb);border:1px solid #cdeefb}
  .bday-hoy .big{font-size:15px;font-weight:700;color:#0a6fb0;margin-bottom:6px;display:flex;align-items:center;gap:6px}
  .bday-row{display:flex;justify-content:space-between;gap:10px;padding:6px 10px;font-size:12px;text-transform:uppercase;color:#3c4350;border-radius:4px}
  .bday-row:nth-child(even){background:#eef4fb}
  .bday-row .d{white-space:nowrap;color:var(--muted)}
  .bday-hoy .bday-row{background:transparent;font-size:13px;font-weight:600;padding:4px 0}
  .w-empty{font-size:12px;color:var(--muted);padding:8px 10px}
  .w-quote{padding:8px 10px 0;font-size:13px}
  .w-quote .q{color:#1aa7e0;font-style:italic;font-weight:600}
  .w-quote .a{color:var(--muted);font-size:11px;margin-top:4px}
  .w-foot{display:flex;justify-content:flex-end;margin-top:14px}
  .btn-continuar{padding:8px 34px;border:0;border-radius:99px;background:#3cc39a;color:#fff;font:inherit;font-weight:700;font-size:13px;cursor:pointer;box-shadow:0 2px 0 #2fa982}
  .btn-continuar:hover{background:#33b28c}
  .confetti{position:absolute;inset:0;pointer-events:none;overflow:hidden;border-radius:10px}
  .confetti i{position:absolute;top:-10px;width:6px;height:10px;border-radius:2px;animation:fall 2.4s ease-in forwards}
  @keyframes fall{to{transform:translateY(520px) rotate(540deg);opacity:0}}

  /* ===== Catálogo empleados ===== */
  .form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px;margin-top:8px}
  .form-grid label{display:flex;flex-direction:column;gap:4px;font-size:12px;font-weight:600;color:var(--muted)}
  .form-grid input{padding:8px 10px;border:1px solid #d6dbe2;border-radius:6px;font:inherit;font-size:14px;color:var(--text)}
  .form-actions{display:flex;gap:8px;margin-top:12px;align-items:center;flex-wrap:wrap}
  .form-msg{font-size:13px}
  .tbl-wrap{overflow-x:auto}
  .tbl-wrap table th{width:auto;white-space:nowrap}
  .link{background:none;border:0;color:var(--primary);font:inherit;font-size:13px;cursor:pointer;padding:2px 4px}
  .link.danger{color:var(--err)}

  /* ===== App ===== */
  .wrap{max-width:900px;margin:0 auto;padding:24px 16px}
  .topbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin-bottom:20px}
  .topbar h1{margin:0;font-size:22px;font-weight:600}
  .actions{display:flex;gap:8px;flex-wrap:wrap}
  .btn{padding:10px 18px;border:0;border-radius:8px;background:var(--primary);color:#fff;font:inherit;font-weight:600;cursor:pointer}
  .btn:hover{background:var(--primary-hover)}
  .btn.ghost{background:#fff;color:var(--text);border:1px solid #d6dbe2;font-weight:400}
  .btn.ghost:hover{background:#f5f7fa}

  .tabs{display:flex;align-items:flex-end;gap:4px;border-bottom:1px solid #d6dbe2;margin-bottom:22px}
  .tab{padding:10px 18px;border:1px solid transparent;border-bottom:0;border-radius:8px 8px 0 0;background:transparent;color:var(--muted);font:inherit;font-weight:600;cursor:pointer;margin-bottom:-1px}
  .tab:hover{color:var(--text)}
  .tab.active{background:#fff;color:var(--primary);border-color:#d6dbe2}
  .tabs .logout{margin-left:auto;margin-bottom:6px;padding:7px 14px}

  .backdrop{position:fixed;inset:0;background:var(--backdrop);display:flex;align-items:center;justify-content:center;padding:16px;z-index:10}
  .modal{width:100%;max-width:540px;background:var(--panel);border-radius:12px;overflow:hidden;box-shadow:0 20px 50px rgba(0,0,0,.25);display:flex;flex-direction:column;min-height:380px}
  .modal-header{display:flex;align-items:center;gap:10px;padding:16px 20px;background:var(--header-bg);border-bottom:1px solid var(--line)}
  .modal-header svg{width:22px;height:22px;color:var(--clip);flex:none}
  .modal-header h2{margin:0;font-size:22px;font-weight:300;letter-spacing:.5px;color:var(--title);text-transform:uppercase}
  .modal-body{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px}
  .upload-btn{display:inline-flex;align-items:center;gap:12px;padding:14px 28px;border:0;border-radius:8px;background:var(--primary);color:#fff;font:inherit;font-size:20px;cursor:pointer;transition:background .15s}
  .upload-btn:hover{background:var(--primary-hover)}
  .upload-btn:disabled{opacity:.6;cursor:default}
  .upload-btn svg{width:30px;height:30px}
  .file-name{font-size:14px;color:var(--muted);min-height:20px;text-align:center;word-break:break-all}
  .status{font-size:14px;min-height:20px;text-align:center}
  .status.err{color:var(--err)} .status.ok{color:var(--ok)}
  .spinner{width:18px;height:18px;border:2px solid #cfe7fb;border-top-color:var(--primary);border-radius:50%;display:inline-block;vertical-align:-4px;margin-right:6px;animation:s 1s linear infinite}
  @keyframes s{to{transform:rotate(360deg)}}
  .modal-footer{display:flex;justify-content:flex-end;padding:0 20px 20px}
  .close-btn{padding:9px 28px;border:1px solid #d6dbe2;border-radius:6px;background:#fff;color:var(--text);font:inherit;font-size:16px;cursor:pointer}
  .close-btn:hover{background:#f5f7fa}

  .card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:18px 20px;margin-bottom:16px}
  .card h3{margin:0 0 4px;font-size:20px}
  .sub{color:var(--muted);font-size:14px;margin-bottom:12px}
  .note{font-size:12px;color:var(--muted);background:#f5f7fa;border-radius:6px;padding:8px 10px;margin-top:12px}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px;margin-top:12px}
  .sec h4{margin:0 0 6px;font-size:13px;text-transform:uppercase;letter-spacing:.4px;color:var(--title)}
  .sec ul{margin:0;padding-left:18px;font-size:14px}
  .sec li{margin-bottom:3px}
  table{width:100%;border-collapse:collapse;font-size:14px;margin-top:8px}
  td,th{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
  th{color:var(--muted);font-weight:600;width:35%}
  .pill{display:inline-block;padding:2px 8px;border-radius:99px;font-size:12px;background:#eef6fe;color:#0a6fb0;margin-right:4px}
  .pill.ok{background:#e8f6ee;color:var(--ok)} .pill.warn{background:#fff4e0;color:var(--warn)} .pill.err{background:#fdecec;color:var(--err)}
  details summary{cursor:pointer;color:var(--primary);font-size:14px;margin-top:10px}
  .list-item{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);cursor:pointer}
  .list-item:hover{background:#fafbfc}
  .empty{color:var(--muted);text-align:center;padding:30px 0}
</style>
</head>
<body>

<!-- ===== Pantalla de inicio ===== -->
<div class="login-screen" id="login">
  <div class="login-card">
    <div class="brand"><div class="word"><b>g</b>enesis</div><div class="tag">RH</div></div>
    <form class="login-form" id="loginForm" autocomplete="off">
      <div class="pill-input">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M17 9V7a5 5 0 0 0-10 0v2H5v13h14V9h-2zm-8 0V7a3 3 0 0 1 6 0v2H9z"/></svg>
        <input id="password" type="password" placeholder="Contraseña" required>
      </div>
      <button class="pill-btn" id="loginBtn" type="submit">Entrar</button>
      <div class="login-msg" id="loginMsg"></div>
    </form>
  </div>
  <div class="corner-mark"><div><b>g</b>enesis</div><span>RH</span></div>
</div>

<!-- ===== Carga ===== -->
<div class="loader" id="loader" hidden>
  <div class="loader-ring"><div class="brand"><div class="word"><b>g</b>enesis</div><div class="tag">RH</div></div></div>
</div>

<!-- ===== App ===== -->
<div class="wrap" id="app" hidden>
  <nav class="tabs">
    <button class="tab active" data-tab="solicitudes">Solicitudes</button>
    <button class="tab" data-tab="catalogos">Catálogos</button>
    <button class="btn ghost logout" id="logoutBtn">Salir</button>
  </nav>

  <!-- Pestaña: Solicitudes -->
  <section class="tab-panel" id="tab-solicitudes">
    <div class="topbar">
      <h1>Solicitudes de empleo</h1>
      <div class="actions">
        <button class="btn ghost" id="listBtn">Ver candidatos</button>
        <button class="btn" id="openBtn">Insertar archivo</button>
      </div>
    </div>
    <div id="results"><div class="empty">Sube una solicitud en PDF para ver el resumen.</div></div>
  </section>

  <!-- Pestaña: Catálogos -->
  <section class="tab-panel" id="tab-catalogos" hidden>
    <div class="topbar">
      <h1>Catálogos</h1>
    </div>
    <div class="card">
      <h3 id="empFormTitle">Nuevo empleado</h3>
      <form id="empForm" autocomplete="off">
        <input type="hidden" id="empId">
        <div class="form-grid">
          <label>Nombre completo *<input id="empNombre" required maxlength="150"></label>
          <label>Departamento<input id="empDepto" maxlength="80" placeholder="Ej. Ventas"></label>
          <label>Puesto<input id="empPuesto" maxlength="80"></label>
          <label>Fecha de nacimiento<input id="empNac" type="date"></label>
          <label>Fecha de ingreso<input id="empIng" type="date"></label>
        </div>
        <div class="form-actions">
          <button class="btn" type="submit" id="empSave">Guardar</button>
          <button class="btn ghost" type="button" id="empCancel" hidden>Cancelar</button>
          <span class="form-msg" id="empMsg"></span>
        </div>
      </form>
    </div>
    <div class="card">
      <h3>Empleados</h3>
      <div class="tbl-wrap" id="empTabla"><div class="empty">Cargando…</div></div>
    </div>
  </section>
</div>

<div class="backdrop" id="modal" hidden>
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <div class="modal-header">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"/></svg>
      <h2 id="modalTitle">Insertar archivo</h2>
    </div>
    <div class="modal-body">
      <button class="upload-btn" id="uploadBtn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M16 16l-4-4-4 4"/><path d="M12 12v9"/><path d="M20.39 18.39A5 5 0 0 0 18 9h-1.26A8 8 0 1 0 3 16.3"/></svg>
        Subir archivo
      </button>
      <input type="file" id="fileInput" accept="application/pdf,.pdf" hidden>
      <div class="file-name" id="fileName"></div>
      <div class="status" id="status"></div>
    </div>
    <div class="modal-footer">
      <button class="close-btn" id="closeBtn">Cerrar</button>
    </div>
  </div>
</div>

<!-- ===== Bienvenida: cumpleaños ===== -->
<div class="backdrop" id="welcome" hidden>
  <div class="welcome" role="dialog" aria-modal="true" aria-labelledby="wTitle">
    <div class="confetti" id="confetti"></div>
    <button class="x" id="wClose" aria-label="Cerrar">×</button>
    <div class="w-head"><span class="ico">📅</span><span id="wTitle">Bienvenido</span></div>
    <div class="w-date" id="wDate"></div>

    <div class="w-sec">
      <div class="w-sec-title">🎂 Cumpleaños de hoy</div>
      <div id="wHoy"></div>
    </div>

    <div class="w-sec">
      <div class="w-sec-title">🗓️ Próximos cumpleaños</div>
      <div id="wProx"></div>
    </div>

    <div class="w-sec">
      <div class="w-sec-title">💬 Frase del día</div>
      <div class="w-quote"><div class="q" id="wFrase"></div><div class="a" id="wAutor"></div></div>
    </div>

    <div class="w-foot"><button class="btn-continuar" id="wCont">Continuar</button></div>
  </div>
</div>

<script>
  const FN_URL = "https://gbiectjjqhbfolnjljoe.supabase.co/functions/v1/analizar-solicitud";
  const $ = id => document.getElementById(id);
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  let CODE = null;

  // Sesión solo mientras la pestaña esté abierta
  const ss = { get(){ try{return sessionStorage.getItem('genesis_code')}catch{return null} },
               set(v){ try{sessionStorage.setItem('genesis_code',v)}catch{} },
               del(){ try{sessionStorage.removeItem('genesis_code')}catch{} } };

  async function api(accion, extra = {}){
    const r = await fetch(FN_URL, {
      method:'POST',
      headers:{ 'x-access-code': CODE, 'content-type':'application/json' },
      body: JSON.stringify({ accion, ...extra })
    });
    const data = await r.json().catch(() => ({ error:`Error ${r.status}` }));
    if (!r.ok || data.error) { const e = new Error(data.error || `Error ${r.status}`); e.status = r.status; throw e; }
    return data;
  }

  // ===== Inicio de sesión =====
  function showApp(){
    $('login').hidden = true; $('app').hidden = false;
    let visto = false; try { visto = sessionStorage.getItem('genesis_bienvenida') === '1'; } catch {}
    if (!visto) mostrarBienvenida();
  }
  function showLogin(msg=''){ $('app').hidden = true; $('modal').hidden = true; $('login').hidden = false; $('loginMsg').textContent = msg; $('password').value=''; $('password').focus(); }

  $('loginForm').addEventListener('submit', async e => {
    e.preventDefault();
    const pwd = $('password').value.trim();
    if (!pwd) return;
    CODE = pwd;
    $('loginBtn').disabled = true; $('loginMsg').textContent = '';
    const loader = $('loader');
    loader.hidden = false; requestAnimationFrame(() => loader.classList.add('show'));
    const espera = new Promise(r => setTimeout(r, 2000));   // carga de ~2 s
    try {
      await Promise.all([api('verificar'), espera]);
      ss.set(pwd); showApp();
    } catch (err) {
      await espera;
      CODE = null; $('loginMsg').textContent = err.status === 401 ? 'Contraseña incorrecta' : err.message;
    } finally {
      loader.classList.remove('show'); setTimeout(() => loader.hidden = true, 250);
      $('loginBtn').disabled = false;
    }
  });
  $('logoutBtn').onclick = () => { CODE = null; ss.del(); try{sessionStorage.removeItem('genesis_bienvenida')}catch{}$('results').innerHTML = '<div class="empty">Sube una solicitud en PDF para ver el resumen.</div>'; showLogin(); };

  (async () => {
    const saved = ss.get();
    if (saved) { CODE = saved; try { await api('verificar'); showApp(); return; } catch { ss.del(); CODE = null; } }
    showLogin();
  })();

  // ===== Bienvenida con cumpleaños =====
  const MESES = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
  const FRASES = [
    ['El talento gana partidos, pero el trabajo en equipo gana campeonatos.', 'Michael Jordan'],
    ['La calidad nunca es un accidente; es el resultado de un esfuerzo inteligente.', 'John Ruskin'],
    ['Solos podemos hacer poco; juntos podemos hacer mucho.', 'Helen Keller'],
    ['El éxito es la suma de pequeños esfuerzos repetidos día tras día.', 'Robert Collier'],
    ['Haz de cada día tu obra maestra.', 'John Wooden'],
    ['La mejor manera de predecir el futuro es crearlo.', 'Peter Drucker'],
    ['Cuida a tu equipo y ellos cuidarán a tus clientes.', 'Richard Branson'],
  ];
  const pad = n => String(n).padStart(2,'0');

  async function mostrarBienvenida(){
    try { sessionStorage.setItem('genesis_bienvenida','1'); } catch {}
    const hoy = new Date();
    $('wDate').textContent = hoy.toLocaleDateString('es-MX', { weekday:'long', day:'numeric', month:'long', year:'numeric' });
    const dIdx = Math.floor(hoy / 86400000) % FRASES.length;
    $('wFrase').textContent = FRASES[dIdx][0]; $('wAutor').textContent = 'Autor: ' + FRASES[dIdx][1];
    $('wHoy').innerHTML = '<div class="w-empty"><span class="spinner"></span>Cargando…</div>';
    $('wProx').innerHTML = '';
    $('welcome').hidden = false;

    try {
      const { cumpleanos = [] } = await api('cumpleanos');
      const y = hoy.getFullYear();
      const base = new Date(y, hoy.getMonth(), hoy.getDate());
      const conDias = cumpleanos.map(c => {
        let prox = new Date(y, c.mes - 1, c.dia);
        if (prox < base) prox = new Date(y + 1, c.mes - 1, c.dia);
        const dias = Math.round((prox - base) / 86400000);
        const antig = c.ingreso_anio ? prox.getFullYear() - c.ingreso_anio : null;
        return { ...c, dias, antig };
      }).sort((a,b) => a.dias - b.dias || a.nombre.localeCompare(b.nombre));

      const fila = c => `<div class="bday-row"><span>${esc(c.nombre)}${c.departamento ? ' - ' + esc(c.departamento) : ''}${c.antig > 0 ? ' - Aniversario #' + c.antig : ''}</span><span class="d">${pad(c.dia)} / ${pad(c.mes)}</span></div>`;
      const deHoy = conDias.filter(c => c.dias === 0);
      const prox = conDias.filter(c => c.dias > 0 && c.dias <= 30);

      $('wHoy').innerHTML = deHoy.length
        ? `<div class="bday-hoy"><div class="big">🎉 ¡Hoy ${deHoy.length === 1 ? 'cumple años' : 'cumplen años'}!</div>${deHoy.map(fila).join('')}</div>`
        : '<div class="w-empty">Nadie cumple años hoy.</div>';
      $('wProx').innerHTML = prox.length ? prox.map(fila).join('') : '<div class="w-empty">Sin cumpleaños en los próximos 30 días.</div>';
      if (deHoy.length) confeti();
      if (!cumpleanos.length) $('wHoy').innerHTML = '<div class="w-empty">Aún no hay empleados con fecha de nacimiento. Agrégalos en <strong>Catálogos</strong>.</div>';
    } catch (e) {
      $('wHoy').innerHTML = `<div class="w-empty" style="color:var(--err)">${esc(e.message)}</div>`;
    }
  }
  function confeti(){
    const box = $('confetti'); box.innerHTML = '';
    const cols = ['#29c1f3','#3cc39a','#ffb020','#f45b9a','#8b7cf6'];
    for (let i = 0; i < 40; i++) {
      const p = document.createElement('i');
      p.style.left = Math.random()*100 + '%';
      p.style.background = cols[i % cols.length];
      p.style.animationDelay = (Math.random()*0.8) + 's';
      box.appendChild(p);
    }
  }
  const cerrarBienvenida = () => $('welcome').hidden = true;
  $('wCont').onclick = cerrarBienvenida;
  $('wClose').onclick = cerrarBienvenida;

  // ===== Pestañas =====
  document.querySelectorAll('.tab').forEach(t => t.onclick = () => {
    document.querySelectorAll('.tab').forEach(x => x.classList.toggle('active', x === t));
    document.querySelectorAll('.tab-panel').forEach(p => p.hidden = p.id !== 'tab-' + t.dataset.tab);
    if (t.dataset.tab === 'catalogos') cargarEmpleados();
  });

  // ===== Catálogo de empleados =====
  let EMPLEADOS = [];
  const fmtF = f => f ? `${f.slice(8,10)}/${f.slice(5,7)}/${f.slice(0,4)}` : '—';
  async function cargarEmpleados(){
    try {
      const { empleados = [] } = await api('empleados_listar');
      EMPLEADOS = empleados;
      $('empTabla').innerHTML = empleados.length ? `<table>
        <tr><th>Nombre</th><th>Departamento</th><th>Puesto</th><th>Nacimiento</th><th>Ingreso</th><th></th></tr>
        ${empleados.map((e,i) => `<tr><td>${esc(e.nombre)}</td><td>${esc(e.departamento||'—')}</td><td>${esc(e.puesto||'—')}</td>
          <td>${fmtF(e.fecha_nacimiento)}</td><td>${fmtF(e.fecha_ingreso)}</td>
          <td style="white-space:nowrap"><button class="link" data-ed="${i}">Editar</button><button class="link danger" data-del="${i}">Eliminar</button></td></tr>`).join('')}
      </table>` : '<div class="empty">Aún no hay empleados.</div>';
      $('empTabla').querySelectorAll('[data-ed]').forEach(b => b.onclick = () => editarEmpleado(EMPLEADOS[+b.dataset.ed]));
      $('empTabla').querySelectorAll('[data-del]').forEach(b => b.onclick = async () => {
        const e = EMPLEADOS[+b.dataset.del];
        if (!confirm(`¿Eliminar a ${e.nombre}?`)) return;
        try { await api('empleados_eliminar', { id: e.id }); cargarEmpleados(); } catch (err) { alert(err.message); }
      });
    } catch (e) {
      if (e.status === 401) return showLogin('Sesión expirada, vuelve a entrar');
      $('empTabla').innerHTML = `<div class="empty" style="color:var(--err)">${esc(e.message)}</div>`;
    }
  }
  function limpiarForm(){
    $('empForm').reset(); $('empId').value = '';
    $('empFormTitle').textContent = 'Nuevo empleado'; $('empCancel').hidden = true;
  }
  function editarEmpleado(e){
    $('empId').value = e.id; $('empNombre').value = e.nombre || ''; $('empDepto').value = e.departamento || '';
    $('empPuesto').value = e.puesto || ''; $('empNac').value = e.fecha_nacimiento || ''; $('empIng').value = e.fecha_ingreso || '';
    $('empFormTitle').textContent = 'Editar empleado'; $('empCancel').hidden = false; $('empMsg').textContent = '';
    $('empNombre').focus();
  }
  $('empCancel').onclick = limpiarForm;
  $('empForm').addEventListener('submit', async ev => {
    ev.preventDefault();
    $('empSave').disabled = true; $('empMsg').textContent = '';
    try {
      await api('empleados_guardar', { empleado: {
        id: $('empId').value || undefined, nombre: $('empNombre').value, departamento: $('empDepto').value,
        puesto: $('empPuesto').value, fecha_nacimiento: $('empNac').value, fecha_ingreso: $('empIng').value } });
      $('empMsg').style.color = 'var(--ok)'; $('empMsg').textContent = 'Guardado ✓';
      limpiarForm(); cargarEmpleados();
    } catch (e) {
      $('empMsg').style.color = 'var(--err)'; $('empMsg').textContent = e.message;
    } finally { $('empSave').disabled = false; }
  });

  // ===== Modal de subida =====
  const modal = $('modal'), fileInput = $('fileInput'), statusEl = $('status'), results = $('results');
  const setStatus = (html, cls='') => { statusEl.className = 'status ' + cls; statusEl.innerHTML = html; };

  $('openBtn').onclick = () => { modal.hidden = false; setStatus(''); $('fileName').textContent=''; };
  $('closeBtn').onclick = () => modal.hidden = true;
  $('uploadBtn').onclick = () => fileInput.click();
  modal.addEventListener('click', e => { if (e.target === modal) modal.hidden = true; });
  document.addEventListener('keydown', e => { if (e.key === 'Escape') modal.hidden = true; });

  fileInput.addEventListener('change', async () => {
    const f = fileInput.files[0];
    fileInput.value = '';
    if (!f) return;
    $('fileName').textContent = `📄 ${f.name} (${(f.size/1024).toFixed(1)} KB)`;
    if (f.size > 20*1024*1024) { setStatus('El PDF supera 20 MB', 'err'); return; }

    $('uploadBtn').disabled = true;
    try {
      // 1) Pedir URL firmada
      setStatus('<span class="spinner"></span>Preparando subida…');
      const { path, signedUrl } = await api('preparar');

      // 2) Subir el PDF directo a Supabase Storage
      setStatus('<span class="spinner"></span>Subiendo PDF…');
      const up = await fetch(signedUrl, { method:'PUT', headers:{ 'content-type':'application/pdf' }, body: f });
      if (!up.ok) throw new Error(`No se pudo subir el PDF (${up.status}): ${(await up.text()).slice(0,200)}`);

      // 3) Analizar
      setStatus('<span class="spinner"></span>Analizando… puede tardar hasta un minuto');
      const data = await api('analizar', { path, nombre: f.name });

      setStatus('Listo ✓', 'ok');
      renderCandidato({ archivo_nombre: f.name, created_at: new Date().toISOString(), analisis: data.analisis });
      setTimeout(() => modal.hidden = true, 700);
    } catch (e) {
      if (e.status === 401) return showLogin('Sesión expirada, vuelve a entrar');
      setStatus(esc(e.message), 'err');
    } finally {
      $('uploadBtn').disabled = false;
    }
  });

  // ===== Resultados =====
  const li = arr => (arr && arr.length) ? `<ul>${arr.map(x => `<li>${esc(x)}</li>`).join('')}</ul>` : '<div class="sub">—</div>';
  const nivel = v => `<span class="pill ${v==='alta'?'ok':v==='media'?'warn':'err'}">${esc(v || '—')}</span>`;

  function renderCandidato(c){
    const a = c.analisis || {};
    const exp = (a.experiencia || []).map(e => `<li><strong>${esc(e.puesto || '—')}</strong> · ${esc(e.empresa || '')} <span class="sub">${esc(e.periodo || '')}</span><br>${esc(e.funciones || '')}</li>`).join('');
    const rec = (a.recuadros || []).map(r => `<tr><th>${esc(r.campo)}</th><td>${esc(r.contenido)}</td></tr>`).join('');
    results.innerHTML = `
      <div class="card">
        <h3>${esc(a.nombre || 'Sin nombre')}</h3>
        <div class="sub">Puesto: ${esc(a.puesto_solicitado || '—')} · ${esc(c.archivo_nombre)} · ${new Date(c.created_at).toLocaleString('es-MX')}</div>
        <p>${esc(a.resumen || '')}</p>
        <div class="grid">
          <div class="sec"><h4>Fortalezas</h4>${li(a.fortalezas)}</div>
          <div class="sec"><h4>Puntos a verificar</h4>${li(a.puntos_a_verificar)}</div>
          <div class="sec"><h4>Inconsistencias / lagunas</h4>${li(a.inconsistencias)}</div>
          <div class="sec"><h4>Campos vacíos</h4>${li(a.campos_vacios)}</div>
          <div class="sec"><h4>Forma de escritura</h4>
            <div>Claridad ${nivel(a.escritura?.claridad)} Completitud ${nivel(a.escritura?.completitud)}</div>
            <div class="sub" style="margin-top:6px">${esc(a.escritura?.observaciones || '')}</div></div>
          <div class="sec"><h4>Habilidades</h4>${(a.habilidades||[]).map(h=>`<span class="pill">${esc(h)}</span>`).join(' ') || '—'}</div>
          <div class="sec"><h4>Escolaridad</h4><div>${esc(a.escolaridad || '—')}</div></div>
          <div class="sec"><h4>Preguntas para entrevista</h4>${li(a.preguntas_entrevista)}</div>
        </div>
        ${exp ? `<div class="sec" style="margin-top:14px"><h4>Experiencia</h4><ul>${exp}</ul></div>` : ''}
        ${rec ? `<details><summary>Ver lo que dice cada recuadro</summary><table>${rec}</table></details>` : ''}
        <div class="note">Resumen guía generado automáticamente. No es una recomendación de contratación; la decisión es tuya. No se evaluaron edad, sexo, estado civil, religión, origen, salud ni foto.</div>
      </div>`;
  }

  $('listBtn').onclick = async () => {
    results.innerHTML = '<div class="empty"><span class="spinner"></span>Cargando…</div>';
    try {
      const { candidatos: list = [] } = await api('listar');
      if (!list.length) { results.innerHTML = '<div class="empty">Aún no hay candidatos.</div>'; return; }
      results.innerHTML = `<div class="card"><h3>Candidatos (${list.length})</h3>${list.map((c,i) => `
        <div class="list-item" data-i="${i}">
          <div><strong>${esc(c.nombre || c.archivo_nombre)}</strong><div class="sub" style="margin:0">${esc(c.puesto_solicitado || '—')}</div></div>
          <div><span class="pill ${c.estado==='analizado'?'ok':c.estado==='error'?'err':'warn'}">${esc(c.estado)}</span>
          <div class="sub" style="margin:0">${new Date(c.created_at).toLocaleDateString('es-MX')}</div></div>
        </div>`).join('')}</div>`;
      results.querySelectorAll('.list-item').forEach(el => el.onclick = () => {
        const c = list[+el.dataset.i];
        if (c.analisis) renderCandidato(c); else alert(c.error || 'Sin análisis');
      });
    } catch (e) {
      if (e.status === 401) return showLogin('Sesión expirada, vuelve a entrar');
      results.innerHTML = `<div class="empty" style="color:var(--err)">${esc(e.message)}</div>`;
    }
  };
</script>
</body>
</html>
